[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextqa-artifact-wrapper"
version = "0.1.0"
description = "Private-first workflow evidence for documentation and demo handoffs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hosted = ["fastapi>=0.121,<1", "uvicorn>=0.38,<1", "psycopg[binary,pool]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "mcp>=1.30,<2"]

[project.scripts]
cqa-artifacts = "cqa_artifacts.__main__:cli"
docs-agent = "cqa_artifacts.agent:cli"
docs-journeys = "cqa_artifacts.journeys:cli"
docs-guides = "cqa_artifacts.guides:cli"
docs-writer = "cqa_artifacts.writer:cli"
docs-library = "cqa_artifacts.library:cli"
cqa-docs-loop = "cqa_artifacts.docs_loop:cli"

[tool.setuptools.packages.find]
include = ["cqa_artifacts*"]

[tool.setuptools.package-data]
cqa_artifacts = ["contextqa-contract.json", "brand/*.svg", "loop_ui/*"]

[project.urls]
Homepage = "https://contextqa.com/?utm_source=github&utm_medium=developer_referral&utm_campaign=contextqa_docs_evidence&utm_content=package_homepage"
Repository = "https://github.com/contextqaai/contextqa-docs-evidence"
Documentation = "https://github.com/contextqaai/contextqa-docs-evidence#readme"
