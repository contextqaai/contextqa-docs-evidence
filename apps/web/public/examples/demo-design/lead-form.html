<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead form step</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="lead-form.css">
</head>
<body>
<div class="ref-1 lead-preview">

  <div class="ref-2" aria-hidden="true"></div>
  <div class="ref-3" aria-hidden="true"><div class="ref-4"></div></div>
  <div class="ref-5" aria-hidden="true">
    <div class="ref-6"></div>
    <div class="ref-7">
      <div class="ref-8"></div>
      <div class="ref-9">
        <div class="ref-10"></div>
        <div class="ref-11"></div>
        <div class="ref-11"></div>
        <div class="ref-11"></div>
      </div>
    </div>
  </div>
  <div class="ref-12" aria-hidden="true"></div>

  <div class="ref-13 lead-overlay">
    <form class="ref-14" role="dialog" aria-labelledby="gate-title">
      <div class="ref-15">
        <div class="ref-16">CHAPTER 1 COMPLETE</div>
        <h2 class="ref-17" id="gate-title">Your test is ready.<br><em class="ref-18">Now watch it run.</em></h2>
        <p class="ref-19">Try the form with a sample email or skip to the next chapter. This preview does not save or send your details.</p>
      </div>

      <div class="ref-20">
        <label class="ref-21" for="g-email">Work email <span class="ref-22">*</span></label>
        <input class="ref-23" id="g-email" type="email" required autocomplete="email" placeholder="name@company.com">
      </div>
      <div class="ref-24">
        <div class="ref-20">
          <label class="ref-21" for="g-name">Name</label>
          <input class="ref-23" id="g-name" type="text" autocomplete="name">
        </div>
        <div class="ref-20">
          <label class="ref-21" for="g-company">Company</label>
          <input class="ref-23" id="g-company" type="text" autocomplete="organization">
        </div>
      </div>
      <div class="ref-20">
        <label class="ref-21" for="g-role">Role</label>
        <select class="ref-25" id="g-role">
          <option>Select your role</option>
          <option>QA engineer or QA lead</option>
          <option>Developer</option>
          <option>Engineering manager</option>
          <option>Other</option>
        </select>
      </div>

      <div class="ref-26">
        <button class="ref-27" type="submit">Continue the demo</button>
        <a class="ref-28" href="player.html#run-and-review">Skip for now</a>
      </div>
      <p class="ref-29">To see how we use your data, read our <a href="https://contextqa.com/privacy-policy">privacy policy</a>.</p>
    </form>
  </div>
</div>
<script src="lead-form.js" defer></script>
</body>
</html>
