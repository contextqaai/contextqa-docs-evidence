name: Publishing security controls
on:
  pull_request:
    paths:
      - "cqa_artifacts/**"
      - "apps/web/src/**"
      - "migrations/**"
      - "tests-hosted/**"
      - "requirements-hosted.lock"
      - ".github/workflows/publishing-security.yml"
permissions:
  contents: read
jobs:
  publishing-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sofa_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d sofa_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-hosted.lock
      - name: Check publishing, identity and tenant controls on the candidate
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/sofa_ci
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ["TEST_DATABASE_URL"]) as db:
              for path in sorted(Path("migrations").glob("*.sql")):
                  db.execute(path.read_text())
          PY
          python -m unittest discover -s tests-hosted -p test_pages_handoff.py -v
          python -m unittest discover -s tests-hosted -p test_hosted.py -v
